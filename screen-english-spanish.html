<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#001e60">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Systems Equipment Line</title>
  <style>
    :root {
      color-scheme: dark;
      --navy: #001e60;
      --blue: #0071ce;
      --yellow: #ffc220;
      --red: #d9002b;
      --green: #168744;
      --white: #fff;
      --soft-blue: #d9efff;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      overflow: hidden;
      color: var(--white);
      background: var(--navy);
      font-family: Arial, Helvetica, sans-serif;
    }

    .screen { position: relative; display: flex; min-height: 100vh; flex-direction: column; isolation: isolate; }
    .screen::before, .screen::after { position: absolute; z-index: -1; content: ""; border-radius: 50%; pointer-events: none; }
    .screen::before { width: 52vw; height: 52vw; top: -28vw; right: -12vw; background: var(--blue); opacity: .8; }
    .screen::after { width: 40vw; height: 40vw; bottom: -25vw; left: -12vw; background: #003b71; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: clamp(.6rem, 1.5vw, 1.25rem) clamp(1rem, 3vw, 3rem);
      border-bottom: 4px solid var(--yellow);
    }
    .brand { display: flex; align-items: center; gap: .75rem; font-size: clamp(1rem, 2vw, 1.5rem); font-weight: 800; letter-spacing: .05em; }
    .spark { width: clamp(2.3rem, 5vw, 4rem); height: clamp(2.3rem, 5vw, 4rem); object-fit: contain; }
    #current-time { color: var(--yellow); font-size: clamp(1.2rem, 3vw, 2.2rem); font-weight: 800; font-variant-numeric: tabular-nums; }

    main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 300px); align-items: center; gap: clamp(.75rem, 2vw, 2rem); min-height: 0; flex: 1; padding: clamp(.75rem, 2vw, 2rem); }
    .poster { width: 100%; min-width: 0; padding: clamp(.6rem, 1.5vw, 1.5rem); border: 5px solid var(--yellow); background: rgba(0, 30, 96, .88); text-align: center; }
    .schedule-panel { width: 100%; min-width: 0; padding: clamp(.75rem, 1.5vw, 1.25rem); border: 4px solid var(--yellow); background: rgba(0, 30, 96, .95); }
    .schedule-title { margin: 0; color: var(--yellow); font-size: clamp(1rem, 1.8vw, 1.5rem); font-weight: 900; line-height: 1; text-transform: uppercase; }
    .schedule-day { margin: .4rem 0 .7rem; color: var(--soft-blue); font-size: clamp(.75rem, 1.2vw, .95rem); font-weight: 700; }
    .schedule-row { margin-top: .45rem; padding: .55rem; border-left: 7px solid var(--soft-blue); background: rgba(255,255,255,.1); }
    .schedule-row.current { border-left-color: #8ff0b7; background: rgba(22, 135, 68, .5); }
    .schedule-row.waiting { border-left-color: var(--red); background: rgba(217, 0, 43, .3); }
    .schedule-row.past { border-left-color: #8ff0b7; background: rgba(22, 135, 68, .28); opacity: .72; }
    .schedule-row.past .schedule-state { color: #8ff0b7; }
    .schedule-group { display: block; font-size: clamp(.9rem, 1.4vw, 1.2rem); font-weight: 900; }
    .schedule-state { display: block; margin-top: .2rem; color: var(--yellow); font-size: clamp(.72rem, 1.1vw, .95rem); font-weight: 900; }
    .schedule-row.current .schedule-state { color: #8ff0b7; }
    .schedule-note { display: block; margin-top: .2rem; color: var(--white); font-size: clamp(.65rem, .9vw, .8rem); font-weight: 700; }
    .schedule-empty { color: var(--soft-blue); font-weight: 700; }

    .signal { display: inline-flex; align-items: center; gap: .45rem; margin-bottom: clamp(.35rem, 1vw, .8rem); color: var(--yellow); font-size: clamp(.85rem, 1.8vw, 1.5rem); font-weight: 900; letter-spacing: .15em; text-transform: uppercase; }
    .signal::before, .signal::after { content: ""; width: clamp(1.5rem, 5vw, 4rem); height: .3rem; background: var(--yellow); }
    .visual-rule { display: flex; justify-content: center; margin: 0 auto clamp(.3rem, 1vw, .8rem); }
    .visual-rule svg { width: min(82vw, 560px); height: auto; overflow: visible; }
    .visual-rule .no-entry { fill: none; stroke: var(--red); stroke-width: 18; }
    .visual-rule .person { fill: var(--yellow); }
    .visual-rule .queue-line { fill: none; stroke: var(--soft-blue); stroke-width: 14; stroke-linecap: round; stroke-dasharray: 2 28; }
    .visual-rule .arrow-away { fill: none; stroke: var(--red); stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }
    .visual-rule .arrow-head { fill: var(--red); }

    h1 { display: grid; gap: .25rem; max-width: 1100px; margin: 0 auto; padding: clamp(.5rem, 1.2vw, 1rem); color: var(--navy); background: var(--yellow); font-size: clamp(1.6rem, 3.5vw, 3.7rem); line-height: .95; letter-spacing: -.045em; overflow-wrap: break-word; text-transform: uppercase; }
    .warning-line { display: block; }
    .rotating-headline { max-width: 950px; margin: clamp(.55rem, 1.2vw, 1rem) auto 0; color: var(--yellow); font-size: clamp(1.15rem, 2.4vw, 2.3rem); font-weight: 900; line-height: 1; text-transform: uppercase; }
    .subhead { max-width: 950px; margin: clamp(.6rem, 1.5vw, 1.2rem) auto 0; color: var(--white); font-size: clamp(1rem, 2.4vw, 2.25rem); font-weight: 800; line-height: 1.04; }
    .cubby-reminder { max-width: 950px; margin: clamp(.5rem, 1.2vw, 1rem) auto 0; padding: .5rem .8rem; color: var(--navy); background: var(--soft-blue); font-size: clamp(1rem, 2vw, 1.8rem); font-weight: 900; line-height: 1; text-transform: uppercase; }

    .status { display: inline-flex; align-items: center; gap: .5rem; margin-top: clamp(.8rem, 2vw, 1.5rem); padding: .55rem .9rem; border: 3px solid currentColor; border-radius: 999px; font-size: clamp(.75rem, 1.4vw, 1.1rem); font-weight: 900; }
    .status::before { width: .9rem; height: .9rem; content: ""; border-radius: 50%; background: currentColor; }
    .status.closed { color: var(--yellow); }
    .status.soon { color: var(--yellow); background: rgba(255, 194, 32, .18); animation: alert-pulse 1.2s ease-in-out infinite; }
    .status.active { color: #8ff0b7; }
    .screen.soon .visual-rule { animation: alert-pulse 1.2s ease-in-out infinite; }
    .screen.soon .signal { color: var(--yellow); }
    @keyframes alert-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .7; transform: scale(1.025); } }

    .poster.language-change { animation: language-change .55s ease-out; }
    .poster.language-change .language { animation: language-label .55s ease-out; }
    @keyframes language-change { 0% { opacity: .25; transform: translateX(1.5rem); } 100% { opacity: 1; transform: translateX(0); } }
    @keyframes language-label { 0% { color: var(--white); } 100% { color: var(--yellow); } }

    footer { display: flex; justify-content: center; padding: 1rem; color: var(--soft-blue); font-size: clamp(.8rem, 1.5vw, 1.1rem); font-weight: 700; text-align: center; }
    .arrow { display: inline-block; margin-left: .35rem; color: var(--yellow); animation: nudge 1.5s ease-in-out infinite; }
    @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(.45rem); } }

    @media (prefers-reduced-motion: reduce) { .arrow, .status.soon, .screen.soon .visual-rule, .poster.language-change, .poster.language-change .language { animation: none; } }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } .schedule-panel { order: -1; } }
    @media (max-width: 600px) { header { align-items: flex-start; flex-direction: column; gap: .6rem; } main { padding: 1rem; } h1 { font-size: clamp(1.8rem, 8vw, 3.5rem); } }
  </style>
</head>
<body>
  <div class="screen">
    <header>
      <div class="brand"><img class="spark" src="spark-logo.png" alt=""> SYSTEMS EQUIPMENT</div>
      <time id="current-time" datetime=""></time>
    </header>

    <main>
      <section class="poster" aria-live="polite">
        <div class="signal" id="signal">Please pause</div>
        <div class="visual-rule" role="img" aria-label="Do not enter the checkout line. A red crossed symbol is shown over people waiting in line.">
          <svg viewBox="0 0 640 190" aria-hidden="true" focusable="false">
            <circle class="no-entry" cx="112" cy="95" r="76"></circle>
            <circle class="person" cx="112" cy="72" r="18"></circle>
            <path class="person" d="M72 142c0-27 18-43 40-43s40 16 40 43z"></path>
            <path class="arrow-away" d="M168 38 42 152"></path>
            <path class="arrow-head" d="m39 119 18 22-30 2z"></path>
            <circle class="person" cx="300" cy="70" r="17"></circle>
            <path class="person" d="M263 137c0-25 16-40 37-40s37 15 37 40z"></path>
            <circle class="person" cx="395" cy="70" r="17"></circle>
            <path class="person" d="M358 137c0-25 16-40 37-40s37 15 37 40z"></path>
            <circle class="person" cx="490" cy="70" r="17"></circle>
            <path class="person" d="M453 137c0-25 16-40 37-40s37 15 37 40z"></path>
            <path class="queue-line" d="M247 158h300"></path>
            <path class="arrow-away" d="M570 150h43"></path>
            <path class="arrow-head" d="m600 133 28 17-28 17z"></path>
          </svg>
        </div>
        <h1 id="headline">STOP — DO NOT ENTER THIS LINE</h1>
        <p class="subhead" id="subhead">Systems equipment checkout is for associates who are on the clock only.</p>
        <p class="cubby-reminder" id="cubby-reminder">CHECK YOUR CUBBY BEFORE GOING TO THE WINDOW</p>
        <div class="status closed" id="status"><span id="status-text">WAIT</span></div>
      </section>
      <aside class="schedule-panel" aria-live="polite">
        <h2 class="schedule-title">Today&rsquo;s groups</h2>
        <div class="schedule-day" id="schedule-day">Schedule</div>
        <div id="schedule-rows"></div>
      </aside>
    </main>

    <footer><span id="footer-message">Thank you for helping keep the line moving</span> <span class="arrow" aria-hidden="true">&rarr;</span></footer>
  </div>

  <script>
    // Monday-Thursday: S1 and S2. Friday-Sunday: S4 and S5.
    var WEEKDAY_SCHEDULES = {
      weekday: [
        { shift: 'S1', times: ['05:00', '05:30', '06:30'] },
        { shift: 'S2', times: ['16:00', '16:30', '17:00'] }
      ],
      weekend: [
        { shift: 'S4', times: ['05:00'] },
        { shift: 'S5', times: ['17:00'] }
      ]
    };
    var LANGUAGE_SECONDS = 7;
    var GRACE_MINUTES = 5;
    // Testing only: use a Monday-Thursday date to preview S1/S2. Leave blank for live time.
    // Example: '2026-10-12T16:10:00' previews Monday at 4:10 PM.
    var DEMO_DATETIME = '';

    var messages = [
      { name: 'English', headline: 'STOP — DO NOT ENTER THIS LINE', subhead: 'Systems equipment checkout is for associates who are on the clock only.', cubby: 'CHECK YOUR CUBBY BEFORE GOING TO THE WINDOW', signal: 'STOP', soon: 'CLOCK-IN BEGINS SOON', procedure: 'EQUIPMENT CHECKOUT PROCEDURE', open: 'OPEN NOW — CHECK OUT IF ON THE CLOCK', waiting: 'PLEASE WAIT UNTIL YOUR START TIME', openLabel: 'OPEN NOW', waitLabel: 'WAIT', closedLabel: 'CLOSED', earlierLabel: 'EARLIER', earlierNote: 'Earlier group', currentNote: 'You may check out if you are on the clock', futureNote: 'Please wait until this time', footer: 'Thank you for helping keep the line moving' },
      { name: 'Español', headline: 'ALTO — NO ENTRE A ESTA FILA', subhead: 'El equipo de sistemas es solo para asociados que están en horario de trabajo.', cubby: 'REVISE SU CASILLERO ANTES DE IR A LA VENTANILLA', signal: 'ALTO', soon: 'LA ENTRADA COMIENZA PRONTO', procedure: 'PROCEDIMIENTO PARA RETIRAR EQUIPO', open: 'ABIERTO — RETIRE EQUIPO SI ESTÁ EN HORARIO', waiting: 'ESPERE HASTA SU HORA DE INICIO', openLabel: 'ABIERTO', waitLabel: 'ESPERE', closedLabel: 'CERRADO', earlierLabel: 'ANTERIOR', earlierNote: 'Grupo anterior', currentNote: 'Puede retirar equipo si está en horario', futureNote: 'Espere hasta esta hora', footer: 'Gracias por ayudar a mantener la fila en movimiento' }
    ];

    var headline = document.getElementById('headline');
    var subhead = document.getElementById('subhead');
    var cubbyReminder = document.getElementById('cubby-reminder');
    var signal = document.getElementById('signal');
    var status = document.getElementById('status');
    var statusText = document.getElementById('status-text');
    var currentTime = document.getElementById('current-time');
    var scheduleDay = document.getElementById('schedule-day');
    var scheduleRows = document.getElementById('schedule-rows');
    var footerMessage = document.getElementById('footer-message');
    var poster = document.querySelector('.poster');
    var messageIndex = 0;

    function getNow() {
      return DEMO_DATETIME ? new Date(DEMO_DATETIME) : new Date();
    }

    function minutesSinceMidnight(date) {
      return date.getHours() * 60 + date.getMinutes();
    }

    function timeToMinutes(time) {
      var parts = time.split(':');
      return Number(parts[0]) * 60 + Number(parts[1]);
    }

    var screen = document.querySelector('.screen');

    function getTodaySchedule(now) {
      var day = now.getDay();
      var groups = day >= 1 && day <= 4 ? WEEKDAY_SCHEDULES.weekday : WEEKDAY_SCHEDULES.weekend;
      var schedule = [];
      for (var g = 0; g < groups.length; g += 1) {
        for (var t = 0; t < groups[g].times.length; t += 1) {
          schedule.push({ shift: groups[g].shift, time: groups[g].times[t], minutes: timeToMinutes(groups[g].times[t]) });
        }
      }
      schedule.sort(function (a, b) { return a.minutes - b.minutes; });
      return schedule;
    }

    function formatTime(time) {
      var parts = time.split(':');
      var hour = Number(parts[0]);
      var period = hour >= 12 ? 'PM' : 'AM';
      var displayHour = hour % 12 || 12;
      return displayHour + ':' + parts[1] + ' ' + period;
    }

    function getClockState(now, schedule) {
      var current = minutesSinceMidnight(now);
      var currentIndex = -1;
      for (var i = 0; i < schedule.length; i += 1) {
        if (current >= schedule[i].minutes - GRACE_MINUTES) currentIndex = i;
      }
      if (currentIndex >= 0) return { name: 'active', index: currentIndex, minutes: 0 };
      var minutesUntil = schedule.length ? schedule[0].minutes - GRACE_MINUTES - current : 0;
      if (minutesUntil > 0 && minutesUntil <= 15) return { name: 'soon', index: -1, minutes: minutesUntil };
      return { name: 'closed', index: -1, minutes: 0 };
    }

    function renderSchedule(now, schedule, state, message) {
      var dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      scheduleDay.textContent = dayNames[now.getDay()] + ' · Open group is highlighted';
      if (!schedule.length) {
        scheduleRows.innerHTML = '<div class="schedule-empty">No groups scheduled today.</div>';
        return;
      }
      var html = '';
      for (var i = 0; i < schedule.length; i += 1) {
        var rowClass = i < state.index ? 'past' : i === state.index ? 'current' : 'waiting';
        var stateText = i < state.index ? message.earlierLabel : i === state.index ? message.openLabel : message.waitLabel;
        var note = i < state.index ? message.earlierNote : i === state.index ? message.currentNote : message.futureNote;
        html += '<div class="schedule-row ' + rowClass + '">';
        html += '<span class="schedule-group">' + schedule[i].shift + ' · ' + formatTime(schedule[i].time) + '</span>';
        html += '<strong class="schedule-state">' + stateText + '</strong>';
        html += '<small class="schedule-note">' + note + '</small></div>';
      }
      scheduleRows.innerHTML = html;
    }

    function renderMessage() {
      var message = messages[messageIndex];
      var now = getNow();
      var schedule = getTodaySchedule(now);
      var state = getClockState(now, schedule);
      headline.textContent = message.headline;
      subhead.textContent = message.subhead;
      cubbyReminder.textContent = message.cubby;
      signal.textContent = state.name === 'active' ? message.procedure : state.name === 'soon' ? message.soon : message.signal;
      footerMessage.textContent = message.footer;
      if (state.name === 'soon') {
        statusText.textContent = message.soon + ': ' + state.minutes + ' min';
      } else if (state.name === 'active') {
        statusText.textContent = message.open;
      } else {
        statusText.textContent = message.waiting;
      }
      status.className = 'status ' + state.name;
      screen.className = 'screen ' + state.name;
      renderSchedule(now, schedule, state, message);
    }

    function twoDigits(value) {
      return value < 10 ? '0' + value : String(value);
    }

    function updateClock() {
      var now = getNow();
      var hours = now.getHours();
      var minutes = twoDigits(now.getMinutes());
      var seconds = twoDigits(now.getSeconds());
      var displayHours = hours % 12 || 12;
      var period = hours >= 12 ? 'PM' : 'AM';
      currentTime.textContent = displayHours + ':' + minutes + ':' + seconds + ' ' + period;
      currentTime.dateTime = now.toISOString();
      renderMessage();
      setTimeout(updateClock, 1025 - (Date.now() % 1000));
    }

    renderMessage();
    updateClock();
    setInterval(function () {
      poster.className = 'poster language-change';
      setTimeout(function () { poster.className = 'poster'; }, 900);
      messageIndex = (messageIndex + 1) % messages.length;
      renderMessage();
    }, LANGUAGE_SECONDS * 1000);
  </script>
</body>
</html>
